name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: gradle/actions/setup-gradle@v5

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Tailscale bridge
        working-directory: bridge
        run: |
          v=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$v golang.org/x/mobile/cmd/gobind@$v
          ./build.sh

      - name: libghostty-vt
        run: ./term/build-ghostty.sh

      - name: Signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          LEGACY_KEYSTORE_BASE64: ${{ secrets.LEGACY_KEYSTORE_BASE64 }}
          LEGACY_STORE_PASSWORD: ${{ secrets.LEGACY_STORE_PASSWORD }}
          LEGACY_KEY_ALIAS: ${{ secrets.LEGACY_KEY_ALIAS }}
          LEGACY_KEY_PASSWORD: ${{ secrets.LEGACY_KEY_PASSWORD }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.SIGNING_LINEAGE_BASE64 }}
        run: |
          # Without these the build would silently fall back to the debug key.
          for v in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD \
                   LEGACY_KEYSTORE_BASE64 LEGACY_STORE_PASSWORD LEGACY_KEY_ALIAS LEGACY_KEY_PASSWORD SIGNING_LINEAGE_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v"; exit 1; }
          done
          d="$RUNNER_TEMP/signing"; mkdir -p "$d"
          base64 -d <<< "$RELEASE_KEYSTORE_BASE64" > "$d/release.jks"
          base64 -d <<< "$LEGACY_KEYSTORE_BASE64" > "$d/legacy.keystore"
          base64 -d <<< "$SIGNING_LINEAGE_BASE64" > "$d/lineage.bin"
          cat > android/keystore.properties <<EOF
          storeFile=$d/release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          legacyStoreFile=$d/legacy.keystore
          legacyStorePassword=$LEGACY_STORE_PASSWORD
          legacyKeyAlias=$LEGACY_KEY_ALIAS
          legacyKeyPassword=$LEGACY_KEY_PASSWORD
          lineageFile=$d/lineage.bin
          EOF

      - name: Build APKs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        id: apks
        run: |
          name=$(grep -Po 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name"; exit 1
          fi
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          mkdir dist
          for abi in arm64-v8a x86_64 universal; do
            out="dist/taildeck-$name-$abi.apk"
            cp "android/app/build/outputs/apk/release/app-$abi-release.apk" "$out"
            "$apksigner" verify --print-certs "$out" | grep -q "Signer #1 certificate DN" || { echo "::error::$out is not signed"; exit 1; }
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: taildeck-apks
          path: dist/

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Taildeck $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
